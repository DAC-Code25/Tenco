[Service]
WorkingDirectory=/home/nvidia/tenco-oak-probe-recovery-v1
# systemd already stops the owned control group; do not match arbitrary command lines.
ExecStartPre=
ExecStart=
ExecStart=/opt/tenco/bin/oak_camera_service --bind 0.0.0.0 --port 18080 --snapshot-dir /home/nvidia/tenco-oak-probe-recovery-v1/Capture --recording-dir /home/nvidia/tenco-oak-probe-recovery-v1/Capture --width 960 --height 540 --fps 15 --jpeg-quality 70 --capture-jpeg-quality 90 --recording-crf 23
